name: Deploy to AWS ECR on dev branch push

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1 # Set your AWS region here
      ECR_REGISTRY: 839119967592.dkr.ecr.us-east-1.amazonaws.com # Replace with your ECR repository name
      ECR_REPOSITORY: k8s-services # Replace with your desired image name
      path_to_dockerfile: "./MEDCHGWEB/Dockerfile"
      docker_build_dir: "."
      
    steps:
      # Step 1: Set up AWS CLI using GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_CI_BOT_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_CI_BOT_ACCESS_SECRET }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 2: Checkout the dev branch code
      - name: Checkout Code
        uses: actions/checkout@v4

      # # Step 3: Log in to Amazon ECR
      # - name: Log in to Amazon ECR
        # id: login-ecr
        # uses: aws-actions/amazon-ecr-login@v1
        
      # Step 4: Set ImageTag Name
      - name: Set ImageTag Name
        run: |
          # Get the branch name
          BRANCH_NAME=${GITHUB_REF##*/}
          
          # Concatenate with GITHUB_RUN_NUMBER
          IMAGE_TAG="${BRANCH_NAME}-v${GITHUB_RUN_NUMBER}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV          
          echo $IMAGE_TAG

      # Step 5: Create Git Tag
      - name: Tag the Commit with Docker Image Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ env.IMAGE_TAG }}" -m "Docker image tag for $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }}"
          git push origin "${{ env.IMAGE_TAG }}"


      - name: GitHub Tag Name example
        run: |
          echo "Tag name from GITHUB_REF_NAME: $GITHUB_REF_NAME"
          echo "Tag name from github.ref_name: ${{  github.ref_name }}"
          
          
