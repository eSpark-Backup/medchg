name: Deploy to AWS ECR on dev branch push

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1 # Set your AWS region here
      ECR_REGISTRY: 839119967592.dkr.ecr.us-east-1.amazonaws.com # Replace with your ECR repository name
      ECR_REPOSITORY: k8s-services # Replace with your desired image name
      path_to_dockerfile: "./MEDCHGWEB/Dockerfile"
      docker_build_dir: "."
      
    steps:
      # Step 1: Set up AWS CLI using GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_CI_BOT_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_CI_BOT_ACCESS_SECRET }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 2: Checkout the dev branch code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 3: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        
      # Step 4: Set ImageTag Name
      - name: Set ImageTag Name
        run: |
          # Get the branch name
          BRANCH_NAME=${GITHUB_REF##*/}
          
          # Concatenate with GITHUB_RUN_NUMBER
          IMAGE_TAG="${BRANCH_NAME}-v${GITHUB_RUN_NUMBER}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV          
          echo $IMAGE_TAG
          
      # Step 4: Build the Docker image
      - name: Build Docker Image
        run: |
          docker build "${{ env.docker_build_dir }}" -f "${{ env.path_to_dockerfile }}" -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Step 6: Push the Docker image to ECR
      - name: Push Docker Image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Make changes to pull request
        run: date +%s > report.txt

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update report
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: main
          delete-branch: true
          title: 'Promote dev to main'
          body: |
            requesting release of new version : $IMAGE_TAG
            - Updated with *today's* date
            - Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          labels: |
            report
            automated pr
          assignees: smhraza
          reviewers: smhraza
          team-reviewers: |
            developers
            qa-team
          milestone: 1
          draft: false
          
      # # Step 3: Open a Pull Request if build succeeds
      # - name: Create Pull Request
        # uses: peter-evans/create-pull-request@v7
        # with:
          # token: ${{ secrets.GITHUB_TOKEN }}
          # branch: stg
          # base: dev
          # title: "Promote dev to stg"
          # body: |
            # This PR automatically promotes changes from the `dev` branch to the `main` branch.
            # Please review the changes and merge the PR.
          # draft: false          