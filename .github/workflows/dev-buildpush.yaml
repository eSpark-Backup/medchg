name: Deploy to AWS ECR on dev branch push

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1 # Set your AWS region here
      ECR_REGISTRY: 839119967592.dkr.ecr.us-east-1.amazonaws.com # Replace with your ECR repository name
      ECR_REPOSITORY: k8s-services # Replace with your desired image name
      path_to_dockerfile: "./MEDCHGWEB/Dockerfile"
      docker_build_dir: "."
      
    steps:
      # Step 1: Set up AWS CLI using GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_CI_BOT_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_CI_BOT_ACCESS_SECRET }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 2: Checkout the dev branch code
      - name: Checkout Code
        uses: actions/checkout@v4

      # # Step 3: Log in to Amazon ECR
      # - name: Log in to Amazon ECR
        # id: login-ecr
        # uses: aws-actions/amazon-ecr-login@v1
        
      # Step 4: Set ImageTag Name
      - name: Set ImageTag Name
        run: |
          # Get the branch name
          BRANCH_NAME=${GITHUB_REF##*/}
          
          # Concatenate with GITHUB_RUN_NUMBER
          IMAGE_TAG="${BRANCH_NAME}-v${GITHUB_RUN_NUMBER}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV          
          echo $IMAGE_TAG

      # Step 5: Create Git Tag
      - name: Tag the Commit with Docker Image Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ env.IMAGE_TAG }}" -m "Docker image tag for $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }}"
          git push origin "${{ env.IMAGE_TAG }}"


      # Step 2: Get the tag for the current commit
      - name: Get Tag for Current Commit
        id: get-current-tag
        run: |
          # Get the tag associated with the current commit, if it exists
          TAG=$(git tag --points-at HEAD)
          if [ -z "$TAG" ]; then
            echo "No tag found for the current commit"
          else
            echo "CURRENT_TAG=$TAG" >> $GITHUB_ENV
          fi
          echo "Current Tag: $TAG"
          
      # Step 2: Authenticate with GitHub (required for pushing tag deletions)
      - name: Authenticate with GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Step 3: Delete older tags with the specified prefix except the latest one
      - name: Delete Old Tags Except Latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="dev-v" # Replace with your desired tag prefix
          
          echo "Fetching all tags..."
          git fetch --tags

          echo "Finding tags with prefix '$PREFIX'..."
          TAGS=$(git tag | grep "^$PREFIX" | sort)

          # Get the most recent tag
          LATEST_TAG=$(git tag -l "$PREFIX*" | sort -V | tail -n 1)

          echo "Latest Tag: $LATEST_TAG"
          echo "Found tags:"
          echo "$TAGS"

          # Loop through the tags and delete all except the latest one
          for TAG in $TAGS; do
            if [ "$TAG" != "$LATEST_TAG" ]; then
              echo "Deleting tag $TAG locally..."
              git tag -d "$TAG"

              echo "Deleting tag $TAG from remote..."
              git push --delete origin "$TAG"
            else
              echo "Skipping deletion of the latest tag: $TAG"
            fi
          done

          echo "Older tags (except the latest) deleted."
          
      # # Step 4: Build the Docker image
      # - name: Build Docker Image
        # run: |
          # docker build "${{ env.docker_build_dir }}" -f "${{ env.path_to_dockerfile }}" -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # # Step 6: Push the Docker image to ECR
      # - name: Push Docker Image to ECR
        # run: |
          # docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

